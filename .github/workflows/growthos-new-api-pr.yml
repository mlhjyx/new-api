name: GrowthOS New API exact-release checks

on:
  pull_request:
    branches:
      - production-parity/settlement-readback-v1

permissions:
  contents: read

concurrency:
  group: growthos-new-api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-code:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Scan the exact pull request tree for secrets
        run: |
          docker run --rm --workdir /repo --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            dir --no-banner --redact --exit-code 1 \
            --gitleaks-ignore-path .gitleaksignore .

      - name: Verify pinned upstream and fork policies
        run: |
          go run ./cmd/release-provenance verify-upstream --repo .
          go run ./cmd/release-license verify --repo . --allow-hold
          go test ./internal/releaseprovenance ./internal/releasepolicy ./internal/licenseinventory ./cmd/release-provenance ./cmd/release-license

      - name: Build both frozen frontends
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=pr-${GITHUB_SHA} bun run build
          # Dockerfile builds classic in its own filtered, clean Bun stage.
          # Sharing default's hoisted date-fns v4 breaks classic's tz v1 peer.
          NEW_API_CLASSIC_BUILD_ROOT=$(mktemp -d "${RUNNER_TEMP}/new-api-classic.XXXXXX")
          git archive --format=tar HEAD:web | tar -xf - -C "${NEW_API_CLASSIC_BUILD_ROOT}"
          cd "${NEW_API_CLASSIC_BUILD_ROOT}"
          bun install --filter ./classic --frozen-lockfile
          cd classic
          VITE_REACT_APP_VERSION=pr-${GITHUB_SHA} bun run build
          mkdir -p "${GITHUB_WORKSPACE}/web/classic/dist"
          cp -a dist/. "${GITHUB_WORKSPACE}/web/classic/dist/"

      - name: Verify private icon adapter reachability
        run: |
          cd web
          bun test shared/lobe-ui-adapter/adapter.test.tsx
          test ! -e node_modules/@giscus/react
          test ! -e node_modules/@splinetool/runtime
          test -f node_modules/@lobehub/ui/package.json
          ! grep -F '"@giscus/react"' bun.lock
          ! grep -F '"@splinetool/runtime"' bun.lock
          grep -RFl "growthos-lobe-flex-adapter" default/dist classic/dist
          ! grep -RFl "@giscus/react" default/dist classic/dist
          ! grep -RFl "@splinetool/runtime" default/dist classic/dist

      - name: Scan both frozen frontend bundles for secrets
        run: |
          docker run --rm --workdir /repo --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            dir --no-banner --redact --exit-code 1 \
            --gitleaks-ignore-path .gitleaksignore web/default/dist
          docker run --rm --workdir /repo --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            dir --no-banner --redact --exit-code 1 \
            --gitleaks-ignore-path .gitleaksignore web/classic/dist

      - name: Run complete Go verification
        run: |
          go test ./...
          set +e
          go vet ./... 2> "${RUNNER_TEMP}/go-vet.raw.txt"
          vet_status=$?
          set -e
          test "${vet_status}" -eq 1
          LC_ALL=C sort -u release/go-vet-baseline.txt > "${RUNNER_TEMP}/go-vet.expected.txt"
          LC_ALL=C sort -u "${RUNNER_TEMP}/go-vet.raw.txt" > "${RUNNER_TEMP}/go-vet.actual.txt"
          diff -u "${RUNNER_TEMP}/go-vet.expected.txt" "${RUNNER_TEMP}/go-vet.actual.txt"
          go test -race ./model ./controller ./router -run Settlement -count=1

  external-databases:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    services:
      mysql-owned:
        image: mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: phase-e-local-only
          MYSQL_DATABASE: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 33061:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pphase-e-local-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-unowned:
        image: mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: phase-e-local-only
          MYSQL_DATABASE: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 33062:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pphase-e-local-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres-owned:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: phase_e
          POSTGRES_PASSWORD: phase-e-local-only
          POSTGRES_DB: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 54321:5432
        options: >-
          --health-cmd="pg_isready -U phase_e"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres-unowned:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: phase_e
          POSTGRES_PASSWORD: phase-e-local-only
          POSTGRES_DB: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U phase_e"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install database ownership sentinels
        env:
          MYSQL_PWD: phase-e-local-only
          PGPASSWORD: phase-e-local-only
        run: |
          docker run --rm --network host -e MYSQL_PWD mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6 \
            mysql -h127.0.0.1 -P33061 -uroot settlement_phase_d_0123456789abcdef0123456789abcdef \
            -e "CREATE TABLE settlement_readback_test_ownership (run_id VARCHAR(32) NOT NULL, dialect VARCHAR(16) NOT NULL, database_name VARCHAR(96) NOT NULL); INSERT INTO settlement_readback_test_ownership VALUES ('0123456789abcdef0123456789abcdef','mysql','settlement_phase_d_0123456789abcdef0123456789abcdef');"
          docker run --rm --network host -e PGPASSWORD postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 \
            psql -h127.0.0.1 -p54321 -Uphase_e -dsettlement_phase_d_0123456789abcdef0123456789abcdef \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE settlement_readback_test_ownership (run_id VARCHAR(32) NOT NULL, dialect VARCHAR(16) NOT NULL, database_name VARCHAR(96) NOT NULL); INSERT INTO settlement_readback_test_ownership VALUES ('0123456789abcdef0123456789abcdef','postgres','settlement_phase_d_0123456789abcdef0123456789abcdef');"

      - name: Run exact MySQL and PostgreSQL contracts
        env:
          TEST_SETTLEMENT_READBACK_OWNERSHIP_ID: 0123456789abcdef0123456789abcdef
          TEST_SETTLEMENT_READBACK_DESTRUCTIVE_ACK: settlement-readback-phase-d-destructive/v1:0123456789abcdef0123456789abcdef
          TEST_MYSQL_DSN: root:phase-e-local-only@tcp(127.0.0.1:33061)/settlement_phase_d_0123456789abcdef0123456789abcdef?charset=utf8mb4&parseTime=True&loc=Local
          TEST_MYSQL_UNOWNED_DSN: root:phase-e-local-only@tcp(127.0.0.1:33062)/settlement_phase_d_0123456789abcdef0123456789abcdef?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgresql://phase_e:phase-e-local-only@127.0.0.1:54321/settlement_phase_d_0123456789abcdef0123456789abcdef?sslmode=disable
          TEST_POSTGRES_UNOWNED_DSN: postgresql://phase_e:phase-e-local-only@127.0.0.1:54322/settlement_phase_d_0123456789abcdef0123456789abcdef?sslmode=disable
        run: go test ./model -run 'SettlementReadback(PhaseD|Readiness|ExternalOwnership)' -count=1

  container-no-push:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Enable containerd image storage for local attestations
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: 'v28.0.4'
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/new-api-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Prepare exact build inputs
        run: |
          REVISION=$(git rev-parse HEAD)
          SOURCE_URI="https://github.com/mlhjyx/new-api/tree/${REVISION}"
          SOURCE_ARCHIVE_URI="https://github.com/mlhjyx/new-api/releases/download/source-${REVISION}/new-api-${REVISION}.tar.gz"
          go run ./cmd/release-provenance prepare-source \
            --repo . --revision "${REVISION}" \
            --source-uri "${SOURCE_URI}" --archive-uri "${SOURCE_ARCHIVE_URI}" \
            --archive-output "${RUNNER_TEMP}/new-api-${REVISION}.tar.gz" \
            --source-sbom "${RUNNER_TEMP}/new-api-source.spdx.json" \
            --output "${RUNNER_TEMP}/new-api-source-provenance.json"
          echo "NEW_API_VERSION=production-parity-${REVISION}" >> "${GITHUB_ENV}"
          echo "RELEASE_REVISION=${REVISION}" >> "${GITHUB_ENV}"
          echo "RELEASE_GIT_TREE=$(jq -r .fork.git_tree "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "PATCH_SHA256=$(jq -r .fork.patch_series_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "TREE_SHA256=$(jq -r .fork.patched_tree_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "RECIPE_SHA256=$(jq -r .build.recipe_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "MODULE_SHA256=$(jq -r .build.module_graph_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "SOURCE_URI=${SOURCE_URI}" >> "${GITHUB_ENV}"
          echo "SOURCE_ARCHIVE_URI=${SOURCE_ARCHIVE_URI}" >> "${GITHUB_ENV}"
          echo "SOURCE_ARCHIVE_SHA256=$(jq -r .corresponding_source.archive_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "SOURCE_SBOM_SHA256=$(jq -r .sbom.source_dependency_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "LICENSE_SHA256=$(jq -r .license.license_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "NOTICE_SHA256=$(jq -r .license.notice_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"
          echo "THIRD_PARTY_SHA256=$(jq -r .license.third_party_sha256 "${RUNNER_TEMP}/new-api-source-provenance.json")" >> "${GITHUB_ENV}"

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: new-api-pr:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            NEW_API_VERSION=${{ env.NEW_API_VERSION }}
            RELEASE_REVISION=${{ env.RELEASE_REVISION }}
            RELEASE_GIT_TREE=${{ env.RELEASE_GIT_TREE }}
            UPSTREAM_REVISION=bde9b2f44887d34ec54799ae191d50f97914359e
            PATCH_SERIES_SHA256=${{ env.PATCH_SHA256 }}
            PATCHED_TREE_SHA256=${{ env.TREE_SHA256 }}
            BUILD_RECIPE_SHA256=${{ env.RECIPE_SHA256 }}
            MODULE_GRAPH_SHA256=${{ env.MODULE_SHA256 }}
            CORRESPONDING_SOURCE_URI=${{ env.SOURCE_URI }}
            CORRESPONDING_SOURCE_ARCHIVE_URI=${{ env.SOURCE_ARCHIVE_URI }}
            CORRESPONDING_SOURCE_ARCHIVE_SHA256=${{ env.SOURCE_ARCHIVE_SHA256 }}
            SOURCE_SBOM_SHA256=${{ env.SOURCE_SBOM_SHA256 }}
            LICENSE_SHA256=${{ env.LICENSE_SHA256 }}
            NOTICE_SHA256=${{ env.NOTICE_SHA256 }}
            THIRD_PARTY_SHA256=${{ env.THIRD_PARTY_SHA256 }}

      - name: Generate final no-push image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: new-api-pr:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/new-api-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate source and image SBOM documents
        run: |
          jq -e '.spdxVersion | startswith("SPDX-")' "${RUNNER_TEMP}/new-api-source.spdx.json"
          jq -e '.packages | length > 0' "${RUNNER_TEMP}/new-api-source.spdx.json"
          jq -e '.spdxVersion | startswith("SPDX-")' "${RUNNER_TEMP}/new-api-image.spdx.json"
          jq -e '.packages | length > 0' "${RUNNER_TEMP}/new-api-image.spdx.json"

      - name: Inspect local container boundary
        run: |
          test "$(docker image inspect new-api-pr:${GITHUB_SHA} --format '{{.Config.User}}')" != ""
          test "$(docker image inspect new-api-pr:${GITHUB_SHA} --format '{{.Config.User}}')" != "0"
          test "$(docker image inspect new-api-pr:${GITHUB_SHA} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          docker create --name new-api-pr-files new-api-pr:${GITHUB_SHA}
          docker export new-api-pr-files | tar -tf - | grep -Fx licenses/LICENSE
          docker export new-api-pr-files | tar -tf - | grep -Fx licenses/NOTICE
          docker export new-api-pr-files | tar -tf - | grep -Fx licenses/THIRD-PARTY-LICENSES.md
          docker export new-api-pr-files | tar -tf - | grep -Fx licenses/license-review.json
          docker export new-api-pr-files | tar -tf - | grep -Fx licenses/license-review.md
          docker rm new-api-pr-files
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777 \
            new-api-pr:${GITHUB_SHA} --version | grep -Fx "production-parity-${GITHUB_SHA}"

      - name: Smoke immutable corresponding-source endpoint and header
        run: |
          container_name=new-api-pr-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "${container_name}" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /data:rw,noexec,nosuid,size=64m,mode=1777 \
            --publish 127.0.0.1:30080:3000 \
            --env SESSION_SECRET=phase-e-pr-local-session-secret-32-bytes \
            --env SQLITE_PATH=/data/new-api.db \
            new-api-pr:${GITHUB_SHA}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --dump-header "${RUNNER_TEMP}/source.headers" \
              --output "${RUNNER_TEMP}/source.json" \
              http://127.0.0.1:30080/api/corresponding-source/v1; then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          tr -d '\r' < "${RUNNER_TEMP}/source.headers" | \
            grep -Fi "Link: <${SOURCE_URI}>; rel=\"source\""
          jq -e --arg revision "${RELEASE_REVISION}" --arg source "${SOURCE_URI}" \
            '.schema_version == "new-api-corresponding-source/v1" and
             .fork.revision == $revision and
             .corresponding_source.uri == $source' \
            "${RUNNER_TEMP}/source.json"
