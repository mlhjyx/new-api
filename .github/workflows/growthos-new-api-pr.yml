name: GrowthOS New API exact-release checks

on:
  pull_request:
    branches:
      - production-parity/settlement-readback-v1

permissions:
  contents: read

concurrency:
  group: growthos-new-api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-code:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Verify pinned upstream and fork policies
        run: |
          go run ./cmd/release-provenance verify-upstream --repo .
          go test ./internal/releaseprovenance ./internal/releasepolicy ./cmd/release-provenance

      - name: Build both frozen frontends
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=pr-${GITHUB_SHA} bun run build
          cd ../classic
          VITE_REACT_APP_VERSION=pr-${GITHUB_SHA} bun run build

      - name: Run complete Go verification
        run: |
          go test ./...
          go vet ./...
          go test -race ./model ./controller ./middleware ./router ./relay/channel ./service

  external-databases:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    services:
      mysql-owned:
        image: mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: phase-e-local-only
          MYSQL_DATABASE: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 33061:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pphase-e-local-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql-unowned:
        image: mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
        env:
          MYSQL_ROOT_PASSWORD: phase-e-local-only
          MYSQL_DATABASE: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 33062:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pphase-e-local-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres-owned:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: phase_e
          POSTGRES_PASSWORD: phase-e-local-only
          POSTGRES_DB: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 54321:5432
        options: >-
          --health-cmd="pg_isready -U phase_e"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres-unowned:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: phase_e
          POSTGRES_PASSWORD: phase-e-local-only
          POSTGRES_DB: settlement_phase_d_0123456789abcdef0123456789abcdef
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U phase_e"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install database ownership sentinels
        env:
          MYSQL_PWD: phase-e-local-only
          PGPASSWORD: phase-e-local-only
        run: |
          docker run --rm --network host -e MYSQL_PWD mysql:8.4.10-oraclelinux9@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6 \
            mysql -h127.0.0.1 -P33061 -uroot settlement_phase_d_0123456789abcdef0123456789abcdef \
            -e "CREATE TABLE settlement_readback_test_ownership (run_id VARCHAR(32) NOT NULL, dialect VARCHAR(16) NOT NULL, database_name VARCHAR(96) NOT NULL); INSERT INTO settlement_readback_test_ownership VALUES ('0123456789abcdef0123456789abcdef','mysql','settlement_phase_d_0123456789abcdef0123456789abcdef');"
          docker run --rm --network host -e PGPASSWORD postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 \
            psql -h127.0.0.1 -p54321 -Uphase_e -dsettlement_phase_d_0123456789abcdef0123456789abcdef \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE settlement_readback_test_ownership (run_id VARCHAR(32) NOT NULL, dialect VARCHAR(16) NOT NULL, database_name VARCHAR(96) NOT NULL); INSERT INTO settlement_readback_test_ownership VALUES ('0123456789abcdef0123456789abcdef','postgres','settlement_phase_d_0123456789abcdef0123456789abcdef');"

      - name: Run exact MySQL and PostgreSQL contracts
        env:
          TEST_SETTLEMENT_READBACK_OWNERSHIP_ID: 0123456789abcdef0123456789abcdef
          TEST_SETTLEMENT_READBACK_DESTRUCTIVE_ACK: settlement-readback-phase-d-destructive/v1:0123456789abcdef0123456789abcdef
          TEST_MYSQL_DSN: root:phase-e-local-only@tcp(127.0.0.1:33061)/settlement_phase_d_0123456789abcdef0123456789abcdef?charset=utf8mb4&parseTime=True&loc=Local
          TEST_MYSQL_UNOWNED_DSN: root:phase-e-local-only@tcp(127.0.0.1:33062)/settlement_phase_d_0123456789abcdef0123456789abcdef?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgresql://phase_e:phase-e-local-only@127.0.0.1:54321/settlement_phase_d_0123456789abcdef0123456789abcdef?sslmode=disable
          TEST_POSTGRES_UNOWNED_DSN: postgresql://phase_e:phase-e-local-only@127.0.0.1:54322/settlement_phase_d_0123456789abcdef0123456789abcdef?sslmode=disable
        run: go test ./model -run 'SettlementReadback(PhaseD|Readiness|ExternalOwnership)' -count=1

  container-no-push:
    if: github.repository == 'mlhjyx/new-api'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: new-api-pr:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Inspect local container boundary
        run: |
          test "$(docker image inspect new-api-pr:${GITHUB_SHA} --format '{{.Config.User}}')" != ""
          test "$(docker image inspect new-api-pr:${GITHUB_SHA} --format '{{.Config.User}}')" != "0"

